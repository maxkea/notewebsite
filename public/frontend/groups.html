<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Groups · Notes Sharing App</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body class="page">

<nav class="navbar">
    <div class="navbar-inner">
        <a class="brand" href="index.html"><span class="brand-mark"></span>Notes</a>
        <ul class="nav-links">
            <li><a href="index.html" data-page="notes">Notes</a></li>
            <li><a href="groups.html" data-page="groups">Groups</a></li>
            <li><a href="profile.html" data-page="profile">Profile</a></li>
            <li><button id="logoutBtn" type="button">Logout</button></li>
        </ul>
    </div>
</nav>

<main class="container">

    <section class="card" style="margin-bottom: 24px;">
        <h2>Create a group</h2>
        <div class="alert alert-error" id="createGroupError"></div>
        <form id="createGroupForm" class="inline-form" novalidate>
            <input type="text" id="groupNameInput" placeholder="Group name" style="flex:1;" required>
            <button type="submit" class="btn btn-primary" id="createGroupSubmit">Create</button>
        </form>
    </section>

    <h2>Your groups</h2>
    <div id="groupsList">
        <p class="skeleton">Loading groups…</p>
    </div>

</main>

<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/groups.js"></script>
<script>initGroupsPage();</script>
</body>
</html>
