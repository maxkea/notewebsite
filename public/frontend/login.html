<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log in · Notes</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body class="page">

<div class="auth-shell">
    <div class="card auth-card">
        <div class="logo">
            <span class="brand"><span class="brand-mark"></span>Notes</span>
        </div>

        <h2>Log in</h2>

        <div class="alert alert-error" id="loginError"></div>

        <form id="loginForm" novalidate>
            <div class="field">
                <label for="email">Email</label>
                <input type="email" id="email" autocomplete="email" required>
            </div>
            <div class="field">
                <label for="password">Password</label>
                <input type="password" id="password" autocomplete="current-password" required>
            </div>
            <button type="submit" class="btn btn-primary btn-block" id="loginSubmit">Log in</button>
        </form>

        <p class="auth-foot">No account yet? <a href="register.html">Create one</a></p>
    </div>
</div>

<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script>initLoginPage();</script>
</body>
</html>
