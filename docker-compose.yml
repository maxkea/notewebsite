services:

  # =========================
  # Frontend + Nginx
  # =========================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    container_name: nginx_frontend
    volumes:
      - ./nginxlog:/var/log/nginx
    ports:
      - "80:80"

    depends_on:
      - backend

    networks:
      - frontend_network


  # =========================
  # Backend + Node.js
  # =========================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: node_backend

    environment:
      PORT: ${PORT}
      JWT_SECRET: ${JWT_SECRET}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
    expose:
      - "3000"

    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./logbackend:/app/logs
    networks:
      - frontend_network
      - backend_network


  # =========================
  # MySQL Database
  # =========================
  db:
    build:
      context: ./db
      dockerfile: Dockerfile

    container_name: mysql_database

    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}

    volumes:
      - mysql_data:/var/lib/mysql

    networks:
      - backend_network

    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-u",
          "root",
          "-p${MYSQL_ROOT_PASSWORD}"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
  grafana:
    image: grafana/grafana:11.5.1
    container_name: grafana
    ports:
      - "3001:3000"
    environment:
      - GF_SMTP_ENABLED=true
      - GF_SMTP_HOST=smtp.gmail.com:587
      - GF_SMTP_USER=${GMAIL_USER}
      - GF_SMTP_PASSWORD=${GMAIL_APP_PASS}
      - GF_SMTP_FROM_ADDRESS=${GMAIL_USER}
      - GF_SMTP_FROM_NAME=Grafana Alerts
    networks:
      - logging-net
  loki:
    image: grafana/loki:3.4.2
    container_name: loki
    user: "0:0"
    volumes:
      - ./loki_alloy/loki-config.yaml:/etc/loki/config.yaml
      - ./logtotal:/tmp/loki
    command: -config.file=/etc/loki/config.yaml
    networks:
      - logging-net
    expose:
      - 3100
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3100/ready || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
  alloy:
    image: grafana/alloy:v1.7.1
    container_name: alloy
    volumes:
      - ./loki_alloy/alloy-local-config.yaml:/etc/alloy/config.alloy
      - ./nginxlog:/var/log/nginx/:ro
      - ./logbackend:/var/log/nodejs/:ro
    command: run /etc/alloy/config.alloy
    depends_on:
      loki:
        condition: service_healthy
    networks:
      - logging-net


# =========================
# Networks
# =========================
networks:
  logging-net:
    driver: bridge

  frontend_network:
    driver: bridge

  backend_network:
    driver: bridge


# =========================
# Persistent Database Data
# =========================
volumes:

  mysql_data: